<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <link rel="icon"
       href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🚀</text></svg>'>
   <title>{TITLE}</title>
   <link rel="stylesheet" href="/static/style.css">
</head>

<body>
   <div class="container">
       <div class="header-zone">
           <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px;">
               <div>
                   <h2 style="margin: 0; display: flex; align-items: baseline; gap: 10px;">
                       {TITLE}
                       <span style="font-size: 0.6em; color: #64748b; font-weight: normal;">Appy {VERSION}</span>
                   </h2>
                   <div style="font-size: 13px; color: #64748b; margin-top: 5px; font-family: monospace;">
                       Sandboxed to: {ROOT_DIR}
                   </div>
               </div>
                          </div>
       </div>

       <div class="tab-bar" style="display: flex; justify-content: space-between; align-items: center;">
           <div style="display: flex; gap: 4px;">
               <button id="btn-tab-patch" class="tab-btn active" onclick="switchTab('tab-patch')">🛠️ Patch</button>
               <button id="btn-tab-bundle" class="tab-btn" onclick="switchTab('tab-bundle')">📦 Builder</button>
               <button id="btn-tab-explorer" class="tab-btn" onclick="switchTab('tab-explorer')">🗺️ Explorer</button>
               <button id="btn-tab-history" class="tab-btn" onclick="switchTab('tab-history')">⏪ History</button>
                              <div style="display: inline-flex; gap: 6px; align-items: center; margin-left: 12px; border-left: 1px solid #334155; padding-left: 12px;">
                   <button id="autoBundleClipBtn" onclick="autoBundleFromClipboard()" title="Read paths from clipboard into scratchpad, build txtar, and copy ready-to-paste bundle to clipboard"
                       style="height: 30px; font-size: 12px; padding: 0 12px; background: #0284c7; border: 1px solid #0369a1; color: #f8fafc; cursor: pointer; font-weight: bold; border-radius: 4px;">⚡ Auto Bundle</button>
                   <button id="runBashClipBtn" onclick="runBashFromClipboard()" title="Run clipboard script in workspace login shell and auto-copy results"
                       style="height: 30px; font-size: 12px; padding: 0 12px; background: #334155; border: 1px solid #475569; color: #f8fafc; cursor: pointer; border-radius: 4px;">⚡ Run Clip</button>
               </div>
           </div>
       </div>

       <!-- INCLUDE:tab_patch -->
       <!-- INCLUDE:tab_builder -->
       <!-- INCLUDE:tab_explorer -->
       <!-- INCLUDE:tab_history -->
   </div>

   <!-- INCLUDE:modal_scoped -->
   <!-- INCLUDE:drawer_bash -->

   <script>window.AppyRootDir = "{ROOT_DIR}";</script>
   <script src="/static/app.js"></script>
   <script src="/static/api.js"></script>
   <script src="/static/builder.js"></script>
   <script src="/static/builder_clipboard.js"></script>
   <script src="/static/builder_dragdrop.js"></script>
   <script src="/static/builder_scope_modal.js"></script>
   <script src="/static/builder_actions.js"></script>
   <script src="/static/explorer.js"></script>
   <script src="/static/history.js"></script>
   <script src="/static/render_preview.js"></script>
   <script src="/static/render_result.js"></script>
   <script src="/static/retest.js"></script>
   <script>
       if (document.readyState === 'loading') {
           document.addEventListener('DOMContentLoaded', () => { loadTxtarState(); fetchSets(); });
       } else {
           loadTxtarState();
           fetchSets();
       }
       syncUIState();
   </script>
</body>

</html>
