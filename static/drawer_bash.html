   <div id="bashDrawer" class="bash-drawer" style="display: none;">
       <div class="bash-drawer-header">
           <div style="display: flex; align-items: center; gap: 8px;">
               <strong style="color: #38bdf8;">⚡ Terminal Output</strong>
               <span id="bashStatusChip" class="status-badge" style="background: rgba(34, 197, 94, 0.2); color: #4ade80;">OK</span>
               <span id="bashDuration" style="font-size: 11px; color: #94a3b8; font-family: monospace;"></span>
               <span id="bashClipNotice" style="font-size: 11px; color: #4ade80; font-weight: bold; display: none;">✓ Output copied to clipboard!</span>
           </div>
           <div style="display: flex; gap: 6px; align-items: center;">
               <button onclick="copyBashOutput()" class="appy-modal-btn">📋 Copy</button>
               <button onclick="closeBashDrawer()" class="appy-modal-close">✕</button>
           </div>
       </div>
       <pre id="bashConsoleOutput" class="bash-drawer-body"></pre>
   </div>
